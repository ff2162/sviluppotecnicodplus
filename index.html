<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPlus MACH1 26v1 - v3.50 (Default: English)</title>
    <style>
        :root { 
            --red: #e31e24; 
            --panel: #1a1a1a; 
            --display: #000; 
            --gate-blue: #2c3e50; 
            --led-red: #ff0000; 
            --lamp-yellow: #ffeb3b; 
        }
        
        body { 
            background: #121212; 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 10px; 
            margin: 0; 
            touch-action: manipulation; 
            user-select: none;
        }
        
        .header-bar { 
            width: 100%; 
            max-width: 850px; 
            padding: 15px 0; 
            display: flex; 
            align-items: center; 
        }
        .logo-main { 
            height: 45px; 
            max-width: 220px; 
            object-fit: contain; 
            filter: drop-shadow(0 0 8px rgba(227, 30, 36, 0.4)); 
        }

        #viewport { 
            width: 100%; 
            max-width: 850px; 
            height: 180px; 
            position: relative; 
            margin-bottom: 15px; 
            background: #1a1a1a; 
            border-radius: 12px; 
            border-bottom: 6px solid #333; 
            overflow: hidden; 
        }
        #col-motor { position: absolute; left: 60px; bottom: 0; width: 45px; height: 140px; background: #333; z-index: 2; border: 1px solid #444; }
        #motor-box { position: absolute; left: 52px; bottom: 0; width: 65px; height: 55px; background: #222; z-index: 6; border: 1px solid #444; border-radius: 4px 4px 0 0; }

        #cover-led { 
            position: absolute; left: 50%; top: 10px; transform: translateX(-50%); 
            width: 8px; height: 35px; background: #400; border-radius: 2px; transition: all 0.2s;
        }
        .led-on { background: #ff3333 !important; box-shadow: 0 0 30px 10px #ff0000, 0 0 10px #ff0000; }
        .led-breath { animation: breath 2.5s ease-in-out infinite; background: #ff0000; }
        @keyframes breath {
            0%, 100% { opacity: 0.15; box-shadow: 0 0 5px #ff0000; }
            50% { opacity: 1; box-shadow: 0 0 35px 12px #ff0000; }
        }
        
        #flasher { position: absolute; top: -35px; left: 5px; width: 35px; height: 35px; z-index: 10; }
        .f-on { fill: var(--lamp-yellow) !important; filter: drop-shadow(0 0 15px var(--lamp-yellow)); }
        .f-off { fill: #430 !important; }

        #gate-leaf { 
            position: absolute; width: calc(100% - 165px); height: 90px; bottom: 10px; left: 105px; 
            background: repeating-linear-gradient(90deg, var(--gate-blue), var(--gate-blue) 35px, #1a252f 37px); 
            border: 2px solid #111; z-index: 5; transform: translateX(0%); will-change: transform;
        }

        .main-layout { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 850px; }
        @media (min-width: 768px) { .main-layout { flex-direction: row; } }
        
        .central-col { flex: 1; display: flex; flex-direction: column; }
        .card-remote-row { display: flex; gap: 15px; align-items: flex-start; margin-bottom: 15px; }

        #mach24 { 
            flex: 1; background: var(--panel); border-radius: 20px; padding: 20px 25px 25px 25px; 
            border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.7); 
        }
        
        .board-title {
            color: var(--red); font-family: 'Segoe UI', sans-serif; font-weight: 900; font-size: 21px;
            font-style: italic; text-align: center; margin-bottom: 12px; letter-spacing: 1.5px;
            text-shadow: 0 0 8px rgba(227, 30, 36, 0.6);
        }

        #display { 
            background: var(--display); height: 90px; border-radius: 10px; display: flex; 
            justify-content: center; align-items: center; font-family: 'Courier New', monospace; 
            font-size: 60px; color: #f00; text-shadow: 0 0 15px rgba(255,0,0,0.7); 
            border: 3px solid #111; margin-bottom: 20px; 
        }
        
        .remote-button { 
            width: 60px; height: 60px; background: #333; border-radius: 50%; 
            border: 2px solid #111; color: #ccc; font-weight: bold; font-size: 20px; 
            box-shadow: 0 4px 0 #000; outline: none; display: flex; justify-content: center; align-items: center;
        }
        .btn-active { background: var(--red) !important; color: #fff !important; transform: translateY(2px); box-shadow: 0 1px 0 #000; }
        
        #info-box { 
            background: #1a1a1a; border-radius: 12px; padding: 15px; border-left: 4px solid var(--red); 
            font-size: 13px; min-height: 120px; line-height: 1.4; box-sizing: border-box; width: 100%;
        }

        .remote-container { 
            width: 85px; background: #222; padding: 15px 5px; border-radius: 25px; 
            text-align: center; border: 2px solid #444; display: flex; flex-direction: column; 
            align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .remote-led { width: 7px; height: 7px; background: #300; border-radius: 50%; margin-bottom: 15px; }
        .remote-led.active { background: #0f0; box-shadow: 0 0 10px #0f0; }

        table { width: 100%; border-collapse: collapse; font-size: 10.5px; background: #161616; }
        td { padding: 6.5px 8px; border-bottom: 1px solid #222; }
        .active-row { background: rgba(227, 30, 36, 0.2); border-left: 3px solid var(--red); }
        .blink { animation: blk 1s step-end infinite; }
        @keyframes blk { 50% { opacity: 0; } }
        
        #footer { margin-top: 20px; width: 100%; max-width: 850px; text-align: right; font-size: 10px; color: #555; border-top: 1px solid #222; padding-top: 5px; }
    </style>
</head>
<body>

<div class="header-bar">
    <img src="D-Plus_Logo.svg" alt="D-Plus" class="logo-main">
</div>

<div id="viewport">
    <div id="col-motor">
        <svg id="flasher" viewBox="0 0 100 120">
            <path id="f-bulb" class="f-off" d="M30,100 Q30,20 50,20 Q70,20 70,100 Z" />
            <rect x="15" y="100" width="70" height="20" fill="#222" rx="2" />
        </svg>
    </div>
    <div id="motor-box"><div id="cover-led"></div></div>
    <div id="gate-leaf"></div>
</div>

<div class="main-layout">
    <div class="central-col">
        <div class="card-remote-row">
            <div id="mach24">
                <div class="board-title">Mach1-26v1</div>
                <div id="display" class="blink">--</div>
                <div style="display:flex; justify-content:space-around;">
                    <div id="keyA" class="remote-button">A</div>
                    <div id="keyB" class="remote-button">B</div>
                </div>
            </div>
            <div class="remote-container">
                <div id="remLed" class="remote-led"></div>
                <button id="btnRem1" class="remote-button" style="width:48px;height:48px;margin-bottom:12px;">1</button>
                <button id="btnRem2" class="remote-button" style="width:48px;height:48px;margin-bottom:12px;">2</button>
            </div>
        </div>
    </div>
    
    <div style="flex:1; min-width:300px; display: flex; flex-direction: column; gap: 15px;">
        <table>
            <tbody id="menu-table">
                <tr id="r-LS"><td>LS</td><td id="lbl-LS">System Language</td><td id="v-LS">EN</td></tr>
                <tr id="r-VN"><td>VN</td><td id="lbl-VN">Motor Speed</td><td id="v-VN">2</td></tr>
                <tr id="r-VR"><td>VR</td><td id="lbl-VR">Slow Speed</td><td id="v-VR">2</td></tr>
                <tr id="r-SR"><td>SR</td><td id="lbl-SR">Slow Space</td><td id="v-SR">1</td></tr>
                <tr id="r-CA"><td>CA</td><td id="lbl-CA">Auto Close</td><td id="v-CA">0</td></tr>
                <tr id="r-FC"><td>FC</td><td id="lbl-FC">Condo Mode</td><td id="v-FC">0</td></tr>
                <tr id="r-AP"><td>AP</td><td id="lbl-AP">Pedestrian Open</td><td id="v-AP">0</td></tr>
                <tr id="r-FL"><td>FL</td><td id="lbl-FL">Flasher Mode</td><td id="v-FL">3</td></tr>
                <tr id="r-CL"><td>CL</td><td id="lbl-CL">Cover LED</td><td id="v-CL">0</td></tr>
            </tbody>
        </table>
        
        <div id="info-box">
            <b style="color:var(--red); font-size:11px;">MACH1 26v1</b><br>
            <span id="info-text">Ready. Hold A (2s) for Menu.</span>
        </div>
    </div>
</div>

<script>
    let mode = "IDLE", gateState = "CLOSED", lastDir = "CLOSING", leafProgress = 0.0, targetProgress = 1.0;
    let lastFrameTime = 0, autoCloseTimer = null, flashInt = null;

    const menuKeys = ['LS', 'VN', 'VR', 'SR', 'CA', 'FC', 'AP', 'FL', 'CL'];
    const maxVals = { LS: 3, VN: 4, VR: 4, SR: 3, CA: 4, FC: 1, AP: 2, FL: 3, CL: 3 };
    const langCodes = ["IT", "EN", "ES", "FR"];

    // DEFAULT SETTINGS: LS=1 (EN), VN=2, CA=0
    let config = { LS: 1, VN: 2, VR: 2, SR: 1, CA: 0, FC: 0, AP: 0, FL: 3, CL: 0 };
    const stored = localStorage.getItem('DPlus_Mach_Config');
    if (stored) config = JSON.parse(stored);

    const langDB = {
        IT: { READY: "Pronto. Tieni premuto A (2s) per il Menu.", SAVE_MSG: "B per cambiare. A+B insieme per Salvare.", LABELS: { LS:["Lingua", "0=IT, 1=EN, 2=ES, 3=FR"], VN:["Velocità", "Potenza motore corsa standard"], CA:["Chiusura Aut.", "0=OFF, 1=3s, 2=7s, 3=10s, 4=15s"], VR:["Vel. Rall.", "Potenza in fase finale"], SR:["Spazio Rall.", "Distanza inizio frenata"], FC:["Condominiale", "Ignora Start in apertura"], AP:["Pedonale", "Ampiezza parziale"], FL:["Lampeggiante", "Logica luce"], CL:["Cover LED", "Logica spia"] } },
        EN: { READY: "Ready. Hold A (2s) for Menu.", SAVE_MSG: "B to change. A+B together to Save.", LABELS: { LS:["Language", "0=IT, 1=EN, 2=ES, 3=FR"], VN:["Motor Speed", "Power during standard run"], CA:["Auto Close", "0=OFF, 1=3s, 2=7s, 3=10s, 4=15s"], VR:["Slow Speed", "Power during final phase"], SR:["Slow Space", "Braking start distance"], FC:["Condo Mode", "Ignore Start when opening"], AP:["Pedestrian", "Partial opening width"], FL:["Flasher", "Light logic"], CL:["Cover LED", "Status light logic"] } }
    };

    const disp = document.getElementById('display'), leaf = document.getElementById('gate-leaf'), bulb = document.getElementById('f-bulb'), cLed = document.getElementById('cover-led'), infoText = document.getElementById('info-text');

    function refreshTable() {
        const curLang = langCodes[config.LS] || "EN";
        const db = (langDB[curLang] || langDB["EN"]).LABELS;
        Object.keys(config).forEach(k => {
            document.getElementById('v-'+k).innerText = (k==='LS'?curLang:config[k]);
            if(db[k]) document.getElementById('lbl-'+k).innerText = db[k][0];
        });
    }

    function updateMenuDisplay() {
        const k = menuKeys[currentIdx], curLang = langCodes[config.LS] || "EN";
        const db = (langDB[curLang] || langDB["EN"]);
        if (mode === "EDIT") { disp.innerText = (k==='LS'?curLang:config[k]); disp.classList.remove('blink'); }
        else { disp.innerText = k; disp.classList.add('blink'); }
        infoText.innerHTML = `<b style="color:var(--red);">${db.LABELS[k][0]}</b><br>${db.LABELS[k][1]}<br><br><small>${db.SAVE_MSG}</small>`;
        document.querySelectorAll('tr').forEach(r=>r.classList.remove('active-row'));
        document.getElementById('r-'+k).classList.add('active-row');
    }

    let isAPressed=false, isBPressed=false, holdATimer=null, comboTimer=null, currentIdx=0;

    window.onkeydown = (e) => {
        const k = e.key.toLowerCase();
        if (k==='a' && !isAPressed) {
            isAPressed=true; document.getElementById('keyA').classList.add('btn-active');
            if(mode==="IDLE") holdATimer = setTimeout(()=>{ mode="MENU"; currentIdx=0; updateMenuDisplay(); }, 2000);
            if(isBPressed) comboTimer = setTimeout(save, 1500);
        } else if (k==='b' && !isBPressed) {
            isBPressed=true; document.getElementById('keyB').classList.add('btn-active');
            if(mode==="MENU") { mode="EDIT"; updateMenuDisplay(); }
            else if(mode==="EDIT") { config[menuKeys[currentIdx]] = (config[menuKeys[currentIdx]]+1) > maxVals[menuKeys[currentIdx]]?0:config[menuKeys[currentIdx]]+1; refreshTable(); updateMenuDisplay(); }
            if(isAPressed) comboTimer = setTimeout(save, 1500);
        }
    };

    window.onkeyup = (e) => {
        const k = e.key.toLowerCase();
        if(k==='a') { 
            isAPressed=false; document.getElementById('keyA').classList.remove('btn-active'); 
            clearTimeout(holdATimer); clearTimeout(comboTimer);
            if(mode==="MENU") { currentIdx=(currentIdx+1)%menuKeys.length; updateMenuDisplay(); }
            else if(mode==="EDIT") { mode="MENU"; updateMenuDisplay(); }
        } else if(k==='b') { 
            isBPressed=false; document.getElementById('keyB').classList.remove('btn-active'); 
            clearTimeout(comboTimer); 
        }
    };

    function save() {
        mode="IDLE"; disp.innerText="OK"; disp.classList.remove('blink');
        localStorage.setItem('DPlus_Mach_Config', JSON.stringify(config));
        setTimeout(()=>{ disp.innerText="--"; disp.classList.add('blink'); refreshTable(); }, 1000);
    }

    refreshTable();
</script>
</body>
</html>
